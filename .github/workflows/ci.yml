name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Warnings are errors (Directory.Build.props); the tests include the published schemas and format examples,
      # and compile the C# examples of README.md and docs/.
      - run: dotnet test --solution Openquote.slnx -c Release
